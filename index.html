<title>Snipingzoo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&family=Krona+One&display=swap">
<style>
/* Fonts ship next to the page in fonts/ (licensed by Snipingzoo). */
@font-face{font-family:'Bank Gothic';src:url('fonts/bankgothic-md.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Bank Gothic Bold';src:url('fonts/bankgothic-bold.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Conduit ITC';src:url('fonts/conduit-itc.woff2') format('woff2');font-weight:400;font-display:swap;size-adjust:115%;ascent-override:73.5%;descent-override:12%;line-gap-override:0%} /* same vertical metrics on every OS */
@font-face{font-family:'Conduit ITC';src:url('fonts/conduit-itc-bold.woff2') format('woff2');font-weight:600 700;font-display:swap;size-adjust:115%;ascent-override:73.5%;descent-override:12%;line-gap-override:0%} /* same vertical metrics on every OS */
/* Layout: a game-lobby frame. Smoky full-screen backdrop, a darker rail on the left with a right-aligned menu,
   the selected screen's content top-right (party list style), button hints bottom-left.
   EDIT: colors live in :root, all text/links live in the CONFIG block in the <script> at the bottom. */
:root{
  --smoke-top:#8b8b87;
  --smoke-mid:#696965;
  --smoke-low:#444441;
  --glow:#d9b21c;          /* warm glow bottom-left */
  --text:#f2f2ee;
  --text-dim:#c9c9c4;
  --line:rgba(255,255,255,.38);
  --gold:#f2c94c;          /* highlighted names */
  --key:#f6d62b;           /* button hints */
  --new:#8fdc6a;           /* "new" badges */
  --row:rgba(120,120,116,.55);
  --rail:rgba(255,255,255,.04);
  --font:'Conduit ITC','Titillium Web','Arial Narrow',system-ui,sans-serif;   /* menus, lists, options, prompts */
  --head:'Bank Gothic','Krona One','Arial Black',sans-serif;                   /* titles, popup headers, counters */
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--smoke-low);color:var(--text);font-family:var(--font);font-size:18px;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
a{color:inherit}
:focus-visible{outline:none}

.screen{position:relative;height:100%;overflow:hidden;
  background:radial-gradient(ellipse 90% 70% at 70% 30%,var(--smoke-top),var(--smoke-mid) 55%,var(--smoke-low) 100%)}
#smoke{position:absolute;inset:0;width:100%;height:100%;display:block}
.art{position:absolute;inset:0;background-position:center;background-size:cover;background-repeat:no-repeat;pointer-events:none}
.glow{position:absolute;left:-12%;bottom:-20%;width:80%;height:52%;pointer-events:none;
  background:radial-gradient(ellipse at 30% 75%,color-mix(in srgb,var(--glow) 85%,transparent),color-mix(in srgb,var(--glow) 30%,transparent) 35%,transparent 70%);
  filter:blur(8px);mix-blend-mode:screen;opacity:1}

/* Everything below is measured off a 1280×720 frame and scales with the window (1u = 1px at 1280×720). */
.screen{--u:min(calc(100vw / 1280),calc(100vh / 720))}
/* the UI lives in a 16:9 stage centred in the window; background layers fill the whole window */
.stage{position:absolute;left:50%;top:50%;width:calc(1280 * var(--u));height:calc(720 * var(--u));transform:translate(-50%,-50%)}
.railbg{position:absolute;top:0;bottom:0;left:0;width:calc((100vw - 1280 * var(--u)) / 2 + 420 * var(--u));background:var(--rail);pointer-events:none}
.rail{position:absolute;top:0;bottom:0;left:0;width:calc(420 * var(--u))}
.rail > *{position:absolute;right:calc(8 * var(--u))}
.brand{top:calc(73 * var(--u));transform:translateY(-50%);display:flex;align-items:center;gap:calc(8 * var(--u))}
.brand img{width:calc(26 * var(--u));height:calc(26 * var(--u));filter:invert(1);display:var(--logo-show,none)}
.brand span{font-family:var(--font);font-weight:700;font-size:calc(25 * var(--u));line-height:1;letter-spacing:.02em;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.rail nav{top:calc(95 * var(--u));right:0;width:100%}
.menu{list-style:none;margin:0;padding:0}
.menu li{position:relative;height:calc(30 * var(--u))}
.menu li.sep{height:0}
.menu li.sep::before,.menu li.sep::after{content:"";position:absolute;right:0;width:calc(310 * var(--u));height:1px}
.menu li.sep::before{top:0;background:linear-gradient(90deg,transparent,rgba(235,234,230,.55) 30%,rgba(235,234,230,.8))}
.menu li.sep::after{top:1px;background:linear-gradient(90deg,transparent,rgba(235,234,230,.25) 30%,rgba(235,234,230,.45))}
.menu button{position:relative;display:block;width:100%;height:100%;text-align:right;padding:0 calc(8 * var(--u)) 0 0;
  font-weight:400;font-size:calc(21 * var(--u));line-height:calc(30 * var(--u));color:var(--text);
  text-shadow:0 1px 2px rgba(0,0,0,.55)}
.menu button::before{content:"";position:absolute;inset:calc(2 * var(--u)) 0 calc(2 * var(--u)) 35%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.2) 70%,rgba(255,255,255,.3));opacity:0;transition:opacity .08s}
.menu button:hover::before,.menu button:focus-visible::before,.menu button[aria-current="page"]::before{opacity:1}
.badge{position:absolute;left:calc(100% + 35 * var(--u));top:50%;transform:translateY(calc(-50% + 2 * var(--u)));
  box-sizing:border-box;height:calc(20 * var(--u));min-width:calc(49 * var(--u));padding:0 calc(3 * var(--u));
  display:flex;align-items:center;justify-content:center;
  font-size:calc(22 * var(--u));font-weight:600;line-height:1;letter-spacing:0;color:#9ff08f;
  border:calc(2 * var(--u)) solid #86cc80;border-radius:calc(5 * var(--u));background:rgba(70,120,60,.1);
  box-shadow:0 0 calc(4 * var(--u)) rgba(134,204,128,.45);
  text-shadow:none;white-space:nowrap}
.badge > span{display:block;text-box:trim-both ex alphabetic} /* centres the lowercase letters exactly, on any OS */
.badge.soon{color:#ffe04a;border-color:#d4b53a;background:rgba(120,100,20,.1);box-shadow:0 0 calc(4 * var(--u)) rgba(212,181,58,.45)}
.status{top:calc(351 * var(--u));transform:translateY(-50%);margin:0;font-size:calc(21 * var(--u));line-height:1;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.keys{top:calc(605 * var(--u));display:flex;flex-direction:column;align-items:flex-end;font-size:calc(21 * var(--u));line-height:calc(30 * var(--u));text-shadow:0 1px 2px rgba(0,0,0,.6)}
.keys b{color:var(--key);font-weight:400}

/* sub-screen (Unleash the Beasts): wide title, episode list, preview card, big count */
.subtitle{top:calc(72 * var(--u));transform:translateY(-50%);margin:0;font-family:var(--head);font-weight:400;font-size:calc(26 * var(--u));line-height:1;letter-spacing:-.046em;color:#d4d4d1;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.rail > .preview{right:0;top:calc(368 * var(--u));width:calc(324 * var(--u));height:calc(182 * var(--u));display:block;overflow:hidden;text-decoration:none;background:#2a2a28}
.preview .pt,.preview .pb{position:absolute;left:0;right:0;height:calc(29 * var(--u));padding-right:calc(8 * var(--u));text-align:right;font-size:calc(21 * var(--u));line-height:calc(29 * var(--u));text-shadow:0 1px 2px rgba(0,0,0,.7);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.preview .pt{top:0;background:rgba(48,48,46,.92);z-index:2}
.preview .pb{bottom:0;background:rgba(20,20,18,.55);z-index:2}
.preview img,.preview .ph{position:absolute;left:0;right:0;top:calc(29 * var(--u));bottom:0;width:100%;height:calc(100% - 29 * var(--u));object-fit:cover}
.preview .ph{display:flex;align-items:center;justify-content:center;font-family:var(--font);font-weight:700;font-size:calc(26 * var(--u));color:rgba(255,255,255,.55);letter-spacing:.06em;
  background:radial-gradient(ellipse at 30% 40%,#7a6a48,#3b3428 55%,#1d1b17)}
.preview:hover .pt,.preview:focus-visible .pt{color:var(--gold)}
.bigcount{position:absolute;right:calc(96 * var(--u));top:calc(624 * var(--u));transform:translateY(-50%);font-family:var(--head);font-size:calc(41 * var(--u));line-height:1;letter-spacing:-.045em;color:rgba(255,255,255,.13);white-space:nowrap;pointer-events:none}
.row .end{font-size:calc(13 * var(--u));min-width:calc(46 * var(--u));text-align:right;font-variant-numeric:tabular-nums}
.keys button{font:inherit;color:inherit;text-shadow:inherit;cursor:pointer}
.keys button:hover{color:#fff}

#panel h1.two{margin:0;line-height:calc(22 * var(--u))}
.panel .h2{font-size:calc(21 * var(--u));line-height:calc(19 * var(--u));color:rgba(255,255,255,.5);margin-bottom:calc(1 * var(--u));text-shadow:0 1px 2px rgba(0,0,0,.5)}
.panel .colhead{position:absolute;right:0;font-family:var(--head);top:calc(22 * var(--u));font-size:calc(21 * var(--u));line-height:calc(19 * var(--u));color:rgba(255,255,255,.25)}
.rows.squad{gap:calc(4 * var(--u))}
.rows.squad .num{min-width:calc(26 * var(--u))}
.rows.squad .row{background:rgba(20,20,18,.2);height:calc(25 * var(--u));font-size:calc(22 * var(--u));transition:background .1s}
.rows.squad .row .nm{color:#fff;opacity:1;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.rows.squad .row .num{color:#fff;opacity:1;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.rows.squad .rk{width:calc(28 * var(--u));height:calc(28 * var(--u));filter:drop-shadow(0 1px 1px rgba(0,0,0,.6))}
.rows.squad .row.on{background:rgba(20,20,18,.32)}
.rows.squad .row.on .nm{color:var(--gold)}
.panel{position:absolute;scrollbar-width:none;-ms-overflow-style:none}
.panel::-webkit-scrollbar{display:none;width:0;height:0}

/* download popup */
button.row.dl{width:100%;border:0;cursor:pointer;text-align:left;font:inherit;font-size:calc(21 * var(--u));color:inherit}
button.row.dl:hover,button.row.dl:focus-visible{background:rgba(160,160,155,.7)}
.popback{position:absolute;inset:0;z-index:40}
.popup{position:absolute;left:calc((100% - 1280 * var(--u)) / 2 + 415 * var(--u));top:calc((100% - 720 * var(--u)) / 2 + 318 * var(--u));
  width:calc(450 * var(--u));min-height:calc(96 * var(--u));padding:0 calc(34 * var(--u)) calc(6 * var(--u)) calc(34 * var(--u));
  background:#5e5e5c;isolation:isolate;box-shadow:0 calc(6 * var(--u)) calc(20 * var(--u)) rgba(0,0,0,.6),0 calc(26 * var(--u)) calc(64 * var(--u)) calc(10 * var(--u)) rgba(0,0,0,.65)}
.popsmoke{position:absolute;inset:0;width:100%;height:100%;z-index:-1;display:block;pointer-events:none}
.poptitle{margin:0;height:calc(30 * var(--u));line-height:calc(30 * var(--u));font-family:var(--head);font-weight:400;font-size:calc(25 * var(--u));letter-spacing:-.042em;text-align:center;text-shadow:0 1px 2px #000}
.poptext{margin:0 0 calc(6 * var(--u));font-size:calc(17 * var(--u));color:var(--text-dim);text-align:center;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.pbar{position:relative;height:calc(14 * var(--u));border:1px solid rgba(255,255,255,.45);background:rgba(0,0,0,.45);margin-bottom:calc(8 * var(--u))}
.pbar i{position:absolute;left:2px;top:2px;bottom:2px;width:0;background:linear-gradient(180deg,#f4f4ef,#b9b9b2);transition:width .18s linear}
.pstat{margin:0 0 calc(10 * var(--u));font-size:calc(19 * var(--u));text-align:right}
.pstat b{color:var(--key);font-weight:400}
.popmenu{margin-top:calc(6 * var(--u))}
@media (max-width:760px){.popup{left:16px;right:16px;width:auto;top:30%}}
.popmenu li{height:calc(30 * var(--u))}
.popmenu button,.popmenu a{position:relative;display:block;width:100%;height:100%;text-align:right;padding:0 calc(8 * var(--u)) 0 0;font-size:calc(21 * var(--u));line-height:calc(30 * var(--u));color:var(--text);text-decoration:none;text-shadow:0 1px 2px rgba(0,0,0,.55)}
.popmenu button::before,.popmenu a::before{content:"";position:absolute;inset:calc(2 * var(--u)) 0 calc(2 * var(--u)) 35%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.2) 70%,rgba(255,255,255,.3));opacity:0}
.popmenu button:hover::before,.popmenu button:focus-visible::before,.popmenu a:hover::before,.popmenu a:focus-visible::before{opacity:1}

/* gamertag popup + live lobby rows */
.poptext.bad{color:#ffb4a8}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.tagform{display:block;margin:0 0 calc(4 * var(--u))}
.tagform input{width:100%;height:calc(32 * var(--u));background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.4);color:#fff;font:inherit;font-size:calc(20 * var(--u));padding:0 calc(10 * var(--u));text-align:center}
.tagform input:focus{outline:none;border-color:var(--key)}
.rows.lobby .row{background:rgba(20,20,18,.2)}
.rows.lobby .row .nm{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.rows.lobby .row .nm.gold,.rows.lobby .row:hover .nm{color:var(--gold)}
.rows.lobby .row.me{background:rgba(20,20,18,.32)}
.rows.lobby button.row{width:100%;border:0;font:inherit;font-size:calc(21 * var(--u));color:inherit;cursor:pointer;text-align:left}
.rows.lobby .row:hover{background:rgba(20,20,18,.32)}
.rows.lobby .more{font-size:calc(17 * var(--u));color:var(--text-dim);padding-left:calc(28 * var(--u))}

/* preloader: title screen (logo lockup up top, a light band across the middle, "Press Any Key") */
html.booting .stage,html.booting .railbg{visibility:hidden}
.boot{position:fixed;inset:0;z-index:100;--u:min(calc(100vw / 1280),calc(100vh / 720));transition:opacity .7s ease}
.boot.out{opacity:0;pointer-events:none}
.boot-stage{position:absolute;inset:0}
.boot-lockup{position:absolute;left:50%;top:calc(50% - 360 * var(--u) + 162 * var(--u));transform:translate(-50%,-50%);opacity:0;transition:opacity 1.4s ease;--cap:calc(34 * var(--u))}
.boot.in .boot-lockup{opacity:1}
/* glowing-tube wordmark: pale mint core, soft green bloom */
.boot-word{position:relative;display:block;font-family:'Bank Gothic Bold',var(--head);font-size:calc(var(--cap) / .516);line-height:1;letter-spacing:.07em;margin-right:-.07em;white-space:nowrap;
  /* solid pale letters with fine green "blinds" running through them (only inside the letters) */
  color:transparent;-webkit-text-stroke:0;
  background:repeating-linear-gradient(180deg,#f2fdee 0 calc(2.2 * var(--u)),#a8e29f calc(2.2 * var(--u)) calc(3.1 * var(--u)));
  -webkit-background-clip:text;background-clip:text;
  /* tight green glow */
  filter:drop-shadow(0 0 calc(1.2 * var(--u)) rgba(170,255,160,.95)) drop-shadow(0 0 calc(4 * var(--u)) rgba(70,225,90,.75)) drop-shadow(0 0 calc(9 * var(--u)) rgba(50,200,70,.3))}
.boot-logo{position:absolute;right:calc(var(--cap) * -.35);top:50%;width:calc(var(--cap) * 6.2);height:calc(var(--cap) * 6.2);transform:translateY(-50%);z-index:-1;
  filter:drop-shadow(0 calc(2 * var(--u)) calc(3 * var(--u)) rgba(0,0,0,.55))}
.boot-band{position:absolute;left:0;right:0;top:calc(50% - 72 * var(--u));height:calc(234 * var(--u));background:rgba(255,255,255,.13);
  box-shadow:0 calc(3 * var(--u)) 0 rgba(0,0,0,.18),0 calc(10 * var(--u)) calc(24 * var(--u)) rgba(0,0,0,.35);display:grid;place-items:center}
.boot-press{background:none;border:0;padding:calc(10 * var(--u)) calc(20 * var(--u));font-family:'Bank Gothic Bold',var(--head);font-size:calc(40.7 * var(--u));line-height:1;letter-spacing:-.07em;color:#fff;cursor:pointer;
  text-shadow:calc(1.5 * var(--u)) calc(1.5 * var(--u)) calc(1 * var(--u)) rgba(0,0,0,.6);animation:bootPulse 2.4s ease-in-out infinite}
.boot-press:focus-visible{outline:none}
@keyframes bootPulse{50%{opacity:.75}}
.boot-load{display:flex;flex-direction:column;align-items:center;gap:calc(8 * var(--u));font-family:var(--font);font-size:calc(19 * var(--u));color:rgba(255,255,255,.75);text-shadow:0 1px 2px rgba(0,0,0,.5)}
.boot-bar{width:calc(300 * var(--u));height:calc(4 * var(--u));background:rgba(0,0,0,.25)}
.boot-bar i{display:block;height:100%;width:0;background:#fff;box-shadow:0 0 calc(8 * var(--u)) rgba(255,255,255,.6);transition:width .2s linear}
@media (max-width:760px){.boot-lockup{--cap:calc(22 * var(--u))}}
@media (prefers-reduced-motion:reduce){.boot,.boot-lockup,.boot-bar i{transition:none}.boot-press{animation:none}}

/* right content: party line + rows, top right */
.panel{position:absolute;top:calc(56 * var(--u));right:calc(96 * var(--u));width:calc(377 * var(--u));max-height:calc(330 * var(--u));overflow-y:auto;scrollbar-width:none}
.panel h1{margin:0 0 calc(17 * var(--u));font-weight:400;font-size:calc(21 * var(--u));line-height:calc(26 * var(--u));white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.panel p{margin:0 0 calc(10 * var(--u));font-size:calc(17 * var(--u));color:var(--text-dim);text-shadow:0 1px 2px rgba(0,0,0,.6)}
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:calc(3 * var(--u))}
.row{display:flex;align-items:center;gap:calc(10 * var(--u));height:calc(26 * var(--u));padding:0 calc(14 * var(--u)) 0 calc(28 * var(--u));background:var(--row);text-decoration:none;font-size:calc(21 * var(--u));font-weight:400}
a.row:hover,a.row:focus-visible{background:rgba(160,160,155,.7)}
.row .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm.gold{color:var(--gold)}
.row .sub{font-size:calc(15 * var(--u));color:var(--text-dim)}
.row .rk{width:calc(22 * var(--u));height:calc(22 * var(--u));flex:none}
.row .num{min-width:2ch;text-align:right;font-variant-numeric:tabular-nums}
.group{margin:calc(10 * var(--u)) 0 calc(3 * var(--u));font-size:calc(14 * var(--u));font-weight:600;letter-spacing:.14em;color:var(--text-dim);text-shadow:0 1px 2px rgba(0,0,0,.6)}
.swatches{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.swatches button{width:calc(88 * var(--u));padding:4px;background:var(--row);text-align:left;font-size:calc(14 * var(--u))}
.swatches i{display:block;height:calc(36 * var(--u));margin-bottom:4px}
.logo-big{width:calc(110 * var(--u));height:calc(110 * var(--u));filter:invert(1);margin:4px 0 12px;display:block}
form{display:flex;gap:6px;margin-top:6px}
input{flex:1;min-width:0;height:calc(30 * var(--u));background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--text);font:inherit;font-size:calc(17 * var(--u));padding:0 8px}
input:focus{border-color:var(--key);outline:none}
.btn{height:calc(30 * var(--u));padding:0 12px;background:var(--row);font-weight:600;font-size:calc(16 * var(--u))}
.btn:hover{background:rgba(160,160,155,.75)}
.ver{position:absolute;right:calc(148 * var(--u));top:calc(677 * var(--u));font-size:calc(12 * var(--u));color:var(--text-dim);letter-spacing:.04em}
.toast{position:absolute;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-size:16px;color:var(--key);text-shadow:0 1px 2px #000;opacity:0;transition:opacity .2s}
.toast.on{opacity:1}

/* phones / small windows: menu on top, content below, page scrolls */
@media (max-width:760px){
  body{overflow:auto}
  .screen{--u:1px;min-height:100%;height:auto;padding-bottom:40px}
  #smoke,.glow{position:fixed}
  .stage{position:static;transform:none;width:auto;height:auto}
  .railbg{display:none}
  .rail{position:relative;width:auto;background:var(--rail);padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;align-items:flex-end}
  .rail > *{position:relative;right:auto;top:auto;transform:none}
  .brand{margin-bottom:8px}
  .rail nav{width:100%;top:auto;right:auto}
  .badge{display:none}
  .status{margin-top:16px}
  .keys{display:none}
  .subtitle{white-space:normal;text-align:right;margin-bottom:10px}
  .rail > .preview{position:relative;width:100%;height:200px;margin-top:16px}
  .bigcount{display:none}
  .panel{position:relative;left:auto;right:auto;top:auto;width:auto;max-height:none;padding:22px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));overflow:visible}
  .ver{position:relative;left:auto;right:auto;top:auto;display:block;text-align:right;padding:20px 16px 0}
}
@media (prefers-reduced-motion:reduce){.menu button::before{transition:none}}
</style>

<div class="boot" id="boot" aria-label="Snipingzoo" hidden>
  <div class="boot-stage">
    <div class="boot-lockup" aria-hidden="true"><span class="boot-word" id="bootName"></span><img class="boot-logo" src="sz-lockup-logo.png" alt=""></div>

  else body = `<ul class="rows"><li><a class="row" ${href(o.link)}><span class="nm gold">${esc(o.title || o.label)}</span><span class="end">▶</span></a></li></ul>`;
  const heading = (o.heading || 'Legacy uploads: {n}').replace(/\{n\}/g, EPS.length);
  panel.innerHTML = `<h1>${esc(heading)}</h1>` + body;
  bigCount.textContent = `${EPS.length} EPISODES`;
  };
}
const seriesOpen = o => { if (o.show === 'link' || o.show === 'latest') preview.click(); else { const r = panel.querySelector('a.row'); if (r) r.focus(); } };

/* --- Roster squads --- */
function renderSquad(g) {
  const n = g.players.length, name = titleCase(g.group);
  setPreview(name, `${n} player${n === 1 ? '' : 's'}`, '', g.thumb, g.card || g.group);
  panel.innerHTML = `<h1 class="two">${esc(g.heading || `${name}: ${n} player${n === 1 ? '' : 's'}..`)}</h1>` +
    `<div class="h2">${esc(CONFIG.rosterSub || '')}</div><span class="colhead">${esc(CONFIG.rosterColumn || '')}</span>` +
    `<ul class="rows squad">${g.players.map((p, k) => `<li><a class="row${k === 0 ? ' on' : ''}" ${href(p.link)}><span class="nm">${esc(p.name)}${p.role ? ` <span class="sub">${esc(p.role)}</span>` : ''}</span>${starIcon}<span class="num">${esc(p.rank ?? '')}</span></a></li>`).join('')}</ul>`;
  bigCount.textContent = `${n}/${total} PLAYERS`;
  const rows = Array.from(panel.querySelectorAll('.rows.squad .row'));
  rows.forEach(r => { const on = () => rows.forEach(x => x.classList.toggle('on', x === r)); r.addEventListener('mouseenter', on); r.addEventListener('focus', on); });
}

const SUBS = {
  uploads: { title: CONFIG.uploadsTitle, top: 95, items: CONFIG.uploadsMenu, label: o => o.label, render: makeSeries(CONFIG.uploads.filter(e => e !== 'sep'), 'UTB'), open: seriesOpen },
  feed: { title: CONFIG.feedTitle, top: 95, items: CONFIG.feedMenu, label: o => o.label, render: makeSeries(CONFIG.feedUploads.filter(e => e !== 'sep'), 'FTB'), open: seriesOpen },
  roster: { title: CONFIG.rosterTitle || 'ROSTER', top: 125, items: CONFIG.roster.flatMap((g, i) => g.sepBefore || i === 0 ? ['sep', g] : [g]),
    label: g => g.group, render: renderSquad, open: () => { const r = panel.querySelector('a.row'); if (r) r.focus(); } }
};
let subButtons = [];
function buildSub(id) {
  const S = SUBS[id]; let k = 0;
  subTitle.textContent = titleCase(S.title);
  subNav.style.top = `calc(${S.top} * var(--u))`;
  subMenu.innerHTML = S.items.map(o => o === 'sep' ? '<li class="sep" aria-hidden="true"></li>' : `<li><button type="button" data-ep="${k++}">${esc(S.label(o))}</button></li>`).join('');
  const list = S.items.filter(o => o !== 'sep');
  subButtons = Array.from(subMenu.querySelectorAll('button'));
  subButtons.forEach(b => {
    const i = +b.dataset.ep;
    b.addEventListener('mouseenter', () => pickSub(i));
    b.addEventListener('focus', () => pickSub(i));
    b.addEventListener('click', () => { pickSub(i); S.open(list[i]); });
  });
}
function pickSub(i) {
  const S = SUBS[sub], list = S.items.filter(o => o !== 'sep');
  subSel = Math.min(i, list.length - 1);
  subButtons.forEach((b, j) => { if (j === subSel) b.setAttribute('aria-current', 'true'); else b.removeAttribute('aria-current'); });
  S.render(list[subSel]); fitPanel();
}
function setKeys() {
  keysEl.innerHTML = sub
    ? '<span>SELECT - <b>ENTER</b></span><button type="button" id="kBack">BACK - <b>ESC</b></button>'
    : '<span>SELECT - <b>ENTER</b></span><span>BACK - <b>ESC</b></span>';
  const kb = document.getElementById('kBack'); if (kb) kb.addEventListener('click', () => show(first));
}
function setSub(id) {
  sub = id || null;
  [brandEl, mainNav, statusEl].forEach(el => el.hidden = !!sub);
  [subTitle, subNav, preview, bigCount].forEach(el => el.hidden = !sub);
  if (sub) { buildSub(sub); subSel = 0; }
  setKeys();
}

let currentId = first;
function show(id) {
  if (!SCREENS[id] && !SUBS[id]) id = first;
  currentId = id;
  if (SUBS[id]) {
    if (sub !== id) setSub(id);
    pickSub(subSel);
    buttons.forEach(b => b.removeAttribute('aria-current'));
    if (location.hash.slice(1) !== id) try { history.replaceState(null, '', '#' + id); } catch (er) {}
    return;
  }
  if (sub) setSub(null);
  if (id === first) { panel.innerHTML = SCREENS.home(); buttons.forEach(b => b.removeAttribute('aria-current')); if (location.hash) try { history.replaceState(null, '', location.pathname + location.search); } catch (er) {} fitPanel(); return; }
  panel.innerHTML = SCREENS[id]();
  buttons.forEach(b => { if (b.dataset.id === id) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  if (location.hash.slice(1) !== id) try { history.replaceState(null, '', '#' + id); } catch (er) {}
  fitPanel();
}
buttons.forEach(b => b.addEventListener('click', () => show(b.dataset.id)));
addEventListener('hashchange', () => show(location.hash.slice(1)));
setKeys();
show(location.hash.slice(1) || first);
if (CONFIG.background) document.getElementById('art').style.backgroundImage = `url("${CONFIG.background}")`;
if (!CONFIG.smoke) document.getElementById('smoke').style.display = 'none';

// keyboard: arrows move, Enter selects, Esc goes back to the first screen
addEventListener('keydown', e => {
  if (e.target.matches('input')) return;
  const list = sub ? subButtons : buttons;
  const i = list.indexOf(document.activeElement);
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    const n = i < 0 ? (sub ? subSel : 0) : (i + (e.key === 'ArrowDown' ? 1 : -1) + list.length) % list.length;
    list[n].focus();
  } else if (e.key === 'Escape') {
    const wasSub = sub; show(first);
    const back = wasSub ? buttons.find(b => b.dataset.id === wasSub) : buttons[0]; if (back) back.focus();
  }
});

/* ---------- Branding kit download popup ---------- */
const dlPop = document.getElementById('dlPop'), dlText = document.getElementById('dlText'), dlMenu = document.getElementById('dlMenu');
const dlBarWrap = document.getElementById('dlBarWrap'), dlBar = document.getElementById('dlBar'), dlStat = document.getElementById('dlStat');
let dlTimer = null, dlReturn = null;
function dlOptions(items) {
  dlMenu.innerHTML = items.map(it => it.href ? `<li><a ${href(it.href)} data-act="${it.act}">${it.label}</a></li>` : `<li><button type="button" data-act="${it.act}">${it.label}</button></li>`).join('');
  const f = dlMenu.querySelector('a,button'); if (f) f.focus();
}
function dlOpen() {
  dlReturn = document.activeElement; dlPop.hidden = false; requestAnimationFrame(() => { if (typeof drawPopSmoke === 'function') drawPopSmoke(); });
  dlText.textContent = `${CONFIG.brandKit.contents}. ZIP · ${CONFIG.brandKit.size}`;
  dlBarWrap.hidden = true; dlStat.hidden = true; dlBar.style.width = '0';
  dlOptions([{ label: 'Download', act: 'go' }, { label: 'Cancel', act: 'close' }]);
}
function dlClose() { clearInterval(dlTimer); dlPop.hidden = true; if (dlReturn && dlReturn.focus) dlReturn.focus(); }
function dlStart() {
  dlBarWrap.hidden = false; dlStat.hidden = false; let p = 0;
  dlOptions([{ label: 'Cancel', act: 'close' }]);
  const tick = () => {
    p = Math.min(100, p + 3 + Math.random() * 9);
    dlBar.style.width = `calc(${p}% - 4px)`;
    dlStat.innerHTML = `Downloading branding kit… <b>${Math.floor(p)}%</b>`;
    if (p >= 100) {
      clearInterval(dlTimer);
      dlStat.innerHTML = 'Download complete.';
      const ok = CONFIG.brandKit.file && CONFIG.brandKit.file !== '#';
      dlOptions(ok ? [{ label: 'Open branding kit', act: 'done', href: CONFIG.brandKit.file }, { label: 'Close', act: 'close' }]
                   : [{ label: 'Close', act: 'close' }]);
      if (!ok) dlStat.innerHTML = 'Download complete. <b>(Kit link not set yet)</b>';
    }
  };
  dlTimer = setInterval(tick, reduceMotion ? 20 : 140); tick();
}
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
document.addEventListener('click', e => {
  if (e.target.closest('#dlOpen')) { dlOpen(); return; }
  const act = e.target.closest('#dlMenu [data-act]'); if (!act) return;
  if (act.dataset.act === 'go') dlStart();
  else if (act.dataset.act === 'close') dlClose();
  else if (act.dataset.act === 'done') setTimeout(dlClose, 50);
});
// while the popup is open: Esc closes it, arrows move within it, nothing reaches the menu behind
addEventListener('keydown', e => {
  if (dlPop.hidden) return;
  e.stopImmediatePropagation();
  const items = Array.from(dlMenu.querySelectorAll('a,button')), i = items.indexOf(document.activeElement);
  if (e.key === 'Escape') { e.preventDefault(); dlClose(); }
  else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length].focus(); }
  else if (e.key === 'Tab') { e.preventDefault(); items[(i + 1) % items.length].focus(); }
}, true);

/* ---------- Live lobby: everyone on the site right now, by gamertag ----------
   Uses the page's "room" (who has it open now; nothing is saved). Your tag and a random level
   are kept in this browser only, so you don't have to type it again. */
function refreshHome() { if (currentId === first && !sub) { panel.innerHTML = SCREENS.home(); fitPanel(); } }
function announce() { if (roomApi && myTag) roomApi.presence({ tag: myTag, lvl: myLvl, since: Date.now() }).catch(() => {}); }
(async () => {
  try { if (window.claude && window.claude.use) roomApi = await window.claude.use('room'); } catch (e) { roomApi = null; }
  if (!roomApi) return;
  roomApi.onPeers(() => refreshHome(), () => { roomApi = null; refreshHome(); });
  announce(); refreshHome();
})();

const tagPop = document.getElementById('tagPop'), tagInput = document.getElementById('tagInput');
let tagReturn = null;
function openTag() {
  tagReturn = document.activeElement; tagPop.hidden = false; tagInput.value = myTag;
  const note = tagPop.querySelector('.poptext'); if (!note.dataset.base) note.dataset.base = note.textContent; note.textContent = note.dataset.base; note.classList.remove('bad');
  requestAnimationFrame(() => { if (typeof drawPopSmoke === 'function') drawPopSmoke(); tagInput.focus(); tagInput.select(); });
}
function closeTag() { tagPop.hidden = true; if (tagReturn && tagReturn.focus && document.contains(tagReturn)) tagReturn.focus(); }
function joinTag() {
  const t = cleanTag(tagInput.value); if (!t) { tagInput.focus(); return; }
  const note = tagPop.querySelector('.poptext');
  if (tagIsBlocked(t)) { note.textContent = "That gamertag isn't allowed. Try another."; note.classList.add('bad'); tagInput.focus(); tagInput.select(); return; }
  note.textContent = note.dataset.base || note.textContent; note.classList.remove('bad');
  myTag = t; try { localStorage.setItem('sz_tag', myTag); localStorage.setItem('sz_lvl', String(myLvl)); } catch (e) {}
  announce(); closeTag(); refreshHome();
}
document.getElementById('tagForm').addEventListener('submit', e => { e.preventDefault(); joinTag(); });
document.addEventListener('click', e => {
  if (e.target.closest('#myRow')) { openTag(); return; }
  const b = e.target.closest('#tagMenu [data-tag]'); if (!b) return;
  if (b.dataset.tag === 'join') joinTag(); else { try { localStorage.setItem('sz_tag_skip', '1'); } catch (er) {} closeTag(); }
});
addEventListener('keydown', e => {
  if (tagPop.hidden) return;
  e.stopImmediatePropagation();
  const items = [tagInput, ...tagPop.querySelectorAll('#tagMenu button')], i = items.indexOf(document.activeElement);
  if (e.key === 'Escape') { e.preventDefault(); closeTag(); }
  else if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') ) { e.preventDefault(); items[(i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length].focus(); }
  else if (e.key === 'Tab') { e.preventDefault(); items[(i + (e.shiftKey ? -1 : 1) + items.length) % items.length].focus(); }
}, true);
// first visit: ask once (skipping is remembered too)
let askedBefore = false; try { askedBefore = !!localStorage.getItem('sz_tag_skip'); } catch (e) {}
if (!myTag && !askedBefore) afterBoot(() => setTimeout(openTag, 500));

let tt;
function toast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('on'), 1800); }
document.addEventListener('click', e => {
  if (e.target.closest('a[data-ph]')) { e.preventDefault(); toast('Link not set yet'); }
  const sw = e.target.closest('[data-hex]');
  if (sw) { try { navigator.clipboard.writeText(sw.dataset.hex).then(() => toast('Copied ' + sw.dataset.hex), () => toast(sw.dataset.hex)); } catch (er) { toast(sw.dataset.hex); } }
});
document.addEventListener('submit', e => { if (e.target.id === 'notify') { e.preventDefault(); toast('Demo form: not connected yet'); } });


/* =====================================================================
   Drifting smoke
   ===================================================================== */
const cv = document.getElementById('smoke'), cx = cv.getContext('2d');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let W, H;
function size() { const s = .5; W = cv.width = Math.round(innerWidth * s); H = cv.height = Math.round(innerHeight * s); }
size(); addEventListener('resize', size);
const puffs = Array.from({ length: 34 }, () => ({ x: Math.random(), y: Math.random(), r: .12 + Math.random() * .3, vx: .00004 + Math.random() * .00012, vy: (Math.random() - .5) * .00004, a: .08 + Math.random() * .14, l: Math.random() < .72 ? 232 : 70 }));
function draw() {
  cx.clearRect(0, 0, W, H);
  for (const p of puffs) {
    p.x += p.vx; p.y += p.vy; if (p.x - p.r > 1.1) p.x = -p.r; if (p.y < -.3) p.y = 1.3; if (p.y > 1.3) p.y = -.3;
    const R = p.r * Math.max(W, H), g = cx.createRadialGradient(p.x * W, p.y * H, 0, p.x * W, p.y * H, R);
    g.addColorStop(0, `rgba(${p.l},${p.l},${p.l - 4},${p.a})`); g.addColorStop(1, `rgba(${p.l},${p.l},${p.l - 4},0)`);
    cx.fillStyle = g; cx.fillRect(0, 0, W, H);
  }
  drawPopSmoke();
  if (!reduce) requestAnimationFrame(draw);
}
function drawPopSmoke() { document.querySelectorAll('.popback:not([hidden]) .popsmoke').forEach(drawOnePop); }
function drawOnePop(pc) {
  const r = pc.getBoundingClientRect(); if (!r.width) return;
  if (pc.width !== Math.round(r.width) || pc.height !== Math.round(r.height)) { pc.width = Math.round(r.width); pc.height = Math.round(r.height); }
  const c = pc.getContext('2d');
  c.fillStyle = '#7a7a76'; c.fillRect(0, 0, pc.width, pc.height);
  // the same drifting puffs as the background, drawn stronger so the smoke reads clearly inside the box
  const big = Math.max(innerWidth, innerHeight);
  for (const p of puffs) {
    const x = p.x * innerWidth - r.left, y = p.y * innerHeight - r.top, R = p.r * big;
    if (x + R < 0 || y + R < 0 || x - R > pc.width || y - R > pc.height) continue;
    const g = c.createRadialGradient(x, y, 0, x, y, R), a = Math.min(.3, p.a * (p.l > 100 ? 1.8 : 1.6));
    g.addColorStop(0, `rgba(${p.l},${p.l},${p.l - 4},${a})`); g.addColorStop(1, `rgba(${p.l},${p.l},${p.l - 4},0)`);
    c.fillStyle = g; c.fillRect(0, 0, pc.width, pc.height);
  }
}
draw();
</script>
